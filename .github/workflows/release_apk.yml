name: Build & Publish Release APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v0.118.0-ai)'
        required: false
        default: 'v0.118.0-ai'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VARIANT: apt-android-7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Split & Universal Debug + Release APKs
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "1"
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "1"
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon
          else
            gradle assembleDebug assembleRelease --no-daemon
          fi

      - name: Collect, Sign (if keystore secret provided), and Checksum APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.TERMUX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TERMUX_RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p dist-apks

          # Copy installable Debug APKs (all 5 ABIs)
          cp -v app/build/outputs/apk/debug/*.apk dist-apks/

          # Find Android build-tools for zipalign / apksigner
          BUILD_TOOLS_DIR="$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Production keystore secret detected — signing Release APKs with apksigner..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
            EFFECTIVE_KEY_PASS="${KEY_PASS:-$STORE_PASS}"
            for apk in app/build/outputs/apk/release/*.apk; do
              base="$(basename "$apk" .apk)"
              signed_out="dist-apks/${base}-signed.apk"
              cp "$apk" "$signed_out"
              "$APKSIGNER" sign \
                --ks /tmp/release.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:${STORE_PASS}" \
                --key-pass "pass:${EFFECTIVE_KEY_PASS}" \
                "$signed_out"
              "$APKSIGNER" verify --verbose "$signed_out"
            done
            rm -f /tmp/release.jks
          else
            echo "No TERMUX_RELEASE_KEYSTORE_BASE64 secret configured — copying unsigned Release APKs alongside installable Debug APKs."
            cp -v app/build/outputs/apk/release/*.apk dist-apks/
          fi

          (cd dist-apks && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload All APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: termux-ai-apks-${{ github.sha }}
          path: |
            dist-apks/*.apk
            dist-apks/SHA256SUMS.txt

      - name: Determine Release Tag
        id: release_meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v0.118.0-ai-${GITHUB_SHA::7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "Termux AI ${{ steps.release_meta.outputs.tag }}"
          body: |
            ## Termux AI — Release & Installable APK Artifacts
            - **Samsung Galaxy A15 5G / Modern 64-bit Android (`arm64-v8a`)**:
              - Installable Debug APK: `termux-app_apt-android-7-debug_arm64-v8a.apk`
              - Release APK: `termux-app_apt-android-7-release_arm64-v8a.apk` (or `-signed.apk` if repository signing secrets are configured)
            - **Universal APK (all architectures)**:
              - Installable Debug APK: `termux-app_apt-android-7-debug_universal.apk`
              - Release APK: `termux-app_apt-android-7-release_universal.apk`
            - **Checksums**: See `SHA256SUMS.txt`
          draft: false
          prerelease: false
          files: |
            dist-apks/*.apk
            dist-apks/SHA256SUMS.txt
